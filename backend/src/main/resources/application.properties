spring.application.name=aulix

# Puerto de AULIX (distinto a DONAVIDA 8080, Act. 3 8102 y Act. 4 8104).
server.port=${PORT:8106}

# --- Base de datos MySQL ---
# Las credenciales NO van escritas aqui: se pasan por variables de entorno.
# Local (PowerShell):  $env:DB_PASS="tu_password"  (la misma de tu MySQL en Docker)
#                      $env:JWT_SECRET="tu_secreto_base64"  (ver README, como generarlo)
#                      .\mvnw.cmd spring-boot:run
# Si no defines nada, usa localhost:3306/aulix_db, usuario root.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aulix_db?createDatabaseIfNotExist=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: crea/actualiza las tablas segun las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# La semilla vive en DatabaseSeeder (Java), NO en data.sql: el hash BCrypt
# de las contrasenas no se puede escribir a mano en SQL.
spring.sql.init.mode=never

# --- Archivos subidos ---
# Maximo 20 MB por archivo y por peticion. Se guardan en ./uploads (ver
# aulix.upload-dir); nunca se devuelve la ruta absoluta en las respuestas.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
aulix.upload-dir=${UPLOAD_DIR:./uploads}

# --- JWT ---
# OBLIGATORIO por variable de entorno. NO hay valor por defecto: si este repo
# se vuelve publico, cualquiera que viera el secreto podria firmar tokens.
# Generarlo (una sola vez, guardarlo en un lugar seguro, NO subirlo a GitHub):
#   PowerShell: [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 }))
#   Linux/VPS:  openssl rand -base64 32
# Luego: $env:JWT_SECRET="lo_que_salio"  (local) o en el .env del VPS.
jwt.secret=${JWT_SECRET}
# 24 horas en milisegundos (86400000). Se puede cambiar con JWT_EXPIRATION.
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Inicio de sesión con Google ---
# ID de cliente de OAuth de Google Cloud (aplicación web). NO es un secreto:
# el mismo valor va en el frontend (VITE_GOOGLE_CLIENT_ID), pero se crea en
# la cuenta de Google de Eduardo y NO debe escribirse ningún valor real aquí.
# Sin esta variable el endpoint POST /api/auth/google responde 400.
# En la VPS va en /opt/aulix/.env como GOOGLE_CLIENT_ID=TU_CLIENT_ID_DE_GOOGLE.
google.client-id=${GOOGLE_CLIENT_ID:}

# --- Correo con Resend ---
# Bienvenida al registrarse y correo de prueba (ver EmailService). Se reutiliza
# la MISMA cuenta y la MISMA clave de Resend que DONAVIDA: no se crea otra clave.
# La clave NO va escrita aquí: se pasa por variable de entorno.
# En la VPS va en /opt/aulix/.env como RESEND_API_KEY=... (la misma de DONAVIDA).
# Remitente: si EMAIL_FROM está vacío, el código usa AULIX <onboarding@resend.dev>
# (sandbox de Resend: solo entrega al correo dueño de la cuenta de Resend).
# Para enviar a cualquier usuario: verifica aulix.study en Resend (agregar los
# registros DNS en name.com, igual que se hizo con donavida.casa) y pon
# EMAIL_FROM=AULIX <noreply@aulix.study> en el .env del VPS, luego reinicia.
resend.api-key=${RESEND_API_KEY:}
resend.from=${EMAIL_FROM:}
